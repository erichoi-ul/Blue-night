<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#081629"
    >

    <title>Blue Night</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="start-page" id="top">

        <!-- ОСНОВНАЯ КОМПОЗИЦИЯ -->
        <div class="main-layout">

            <!-- ЛЕВАЯ ЗОНА: ПОИСК И БЫСТРЫЙ ДОСТУП -->
            <div class="left-content">

                <!-- ПОИСК -->
                <section class="search-section">
                    <form
                        class="search-form"
                        action="https://www.google.com/search"
                        method="get"
                    >
                        <label for="search-input" class="visually-hidden">
                            Поиск в интернете
                        </label>

                        <input
                            type="search"
                            id="search-input"
                            name="q"
                            placeholder="Найти что-нибудь интересное..."
                            autocomplete="off"
                        >

                        <button type="submit" aria-label="Искать">→</button>
                    </form>
                </section>

                <!-- БЫСТРЫЙ ДОСТУП -->
                <aside class="sites-section">
                    <div class="sites-grid">
                        <a class="site-link" href="https://www.youtube.com/"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="YouTube" title="YouTube">
                            <img class="site-icon" src="icon/youtube.png" alt="">
                        </a>

                        <a class="site-link" href="https://ru.pinterest.com/"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="Pinterest" title="Pinterest">
                            <img class="site-icon" src="icon/pinterest.png" alt="">
                        </a>

                        <a class="site-link" href="https://github.com/"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="GitHub" title="GitHub">
                            <img class="site-icon" src="icon/github.png" alt="">
                        </a>

                        <a class="site-link" href="https://chatgpt.com/"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="ChatGPT" title="ChatGPT">
                            <img class="site-icon" src="icon/chatgpt.png" alt="">
                        </a>

                        <a class="site-link" href="https://www.rksi.ru/schedule"
                        target="_blank" rel="noopener noreferrer"
                        aria-label="РКСИ" title="РКСИ">
                            <img class="site-icon" src="icon/rksi.png" alt="">
                        </a>
                    </div>
                </aside>

                <!-- МУЗЫКА -->
                <aside class="music-section" id="music">
                    <img class="music-cover"
                        src="images/music-cover.jpg"
                        alt="Обложка музыкального плейлиста">

                    <div class="music-info">
                        <div>
                            <h2>Моя музыка</h2>
                            <p>Плейлист для учёбы, отдыха и ночных мыслей</p>
                        </div>
                    </div>

                    <a class="music-link"
                    href="https://www.youtube.com/watch?v=9y_xRVfJf1A"
                    target="_blank" rel="noopener noreferrer">
                        Открыть музыку ↗
                    </a>
                </aside>

            </div>

            <!-- ЧАСЫ СПРАВА -->
            <header class="hero">
                <div class="clock">
                    <time id="clock-time">00:00</time>
                    <p id="clock-date">Загрузка даты...</p>
                    <p class="blue-night-title">BLUE NIGHT</p>
                </div>
            </header>

        </div>
    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
